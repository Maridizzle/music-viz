name: Build Windows desktop app

# Builds the downloadable Windows screensaver (.exe) on a real Windows runner.
# - Run manually (Actions → Run workflow) to just build the artifact.
# - Run manually with a "release_tag" (e.g. v0.1.0) to also create a public GitHub
#   Release with the installers attached — a permanent, shareable download link.
# - Pushing a v* tag does the same automatically.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a public Release with this tag (e.g. v0.1.0). Leave blank to build the artifact only.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Build the web app with relative paths into desktop/web (ELECTRON=1).
      - run: npm ci
      - run: npm run build:desktop

      # Package the Electron shell into an NSIS installer + a portable .exe.
      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Build installers
        working-directory: desktop
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: MusicVisualizer-Windows
          path: desktop/release/*.exe
          if-no-files-found: error

      # Create/attach a public Release when a tag was pushed, or when a release_tag
      # input was supplied to a manual run. softprops creates the tag if it's new.
      - name: Publish Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name }}
          name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name }}
          files: desktop/release/*.exe
          body: |
            **Music Visualizer** — a Windows desktop screensaver that reacts to whatever is playing on your PC (Spotify, YouTube, games) with no setup, by capturing system audio via WASAPI loopback. 39 audio-reactive presets, a global beat camera, and auto-shuffle.

            **Download** one of the assets below:
            - **Music Visualizer Setup … .exe** — installer (adds Start Menu / desktop shortcuts).
            - **MusicVisualizer-…-portable.exe** — single file, no install.

            The build is unsigned, so Windows SmartScreen shows a one-time warning: **More info → Run anyway**. Then just play music — it reacts automatically. Esc quits, F11 toggles fullscreen, ⚙️ switches presets.
